MONITOR eaton@localhost 1 monitor upsmonitor master

NOTIFYCMD /usr/local/bin/nut-notify.sh

NOTIFYFLAG ONLINE   EXEC
NOTIFYFLAG ONBATT   EXEC
NOTIFYFLAG LOWBATT  EXEC
NOTIFYFLAG FSD      EXEC
NOTIFYFLAG COMMOK   EXEC
NOTIFYFLAG COMMBAD  EXEC
NOTIFYFLAG NOCOMM   EXEC
NOTIFYFLAG REPLBATT EXEC

NOTIFYMSG ONLINE   "UPS %s: power restored (on line)"
NOTIFYMSG ONBATT   "UPS %s: on battery"
NOTIFYMSG LOWBATT  "UPS %s: battery low"
NOTIFYMSG FSD      "UPS %s: forced shutdown in progress"
NOTIFYMSG COMMOK   "UPS %s: communications restored"
NOTIFYMSG COMMBAD  "UPS %s: communications lost"
NOTIFYMSG NOCOMM   "UPS %s: unavailable"
NOTIFYMSG REPLBATT "UPS %s: battery needs replacing"

# Can't shut down the host from inside a container
SHUTDOWNCMD "/bin/true"

POWERDOWNFLAG /run/nut/killpower

POLLFREQ 5
POLLFREQALERT 2
