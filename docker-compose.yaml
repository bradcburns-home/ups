services:
  nut:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nut-prod
    privileged: true
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    volumes:
      - /dev/bus/usb:/dev/bus/usb:rw
      - ./conf/nut.conf:/etc/nut/nut.conf
      - ./conf/ups.conf:/etc/nut/ups.conf
      - ./conf/upsd.conf:/etc/nut/upsd.conf
      - ./conf/upsd.users:/etc/nut/upsd.users
    ports:
      - "3493:3493"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "upsc", "eaton@localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - iot

  ups-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: final
      secrets:
        - github_token
    container_name: ups-web-prod
    environment:
      - ENVIRONMENT_NAME=prod
      - NUT_HOST=nut-prod
      - NUT_UPS_NAME=eaton
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/service-account.json
    volumes:
      - /srv/shared/mosquitto/secrets/burns-agentspace-40a6a96a259d.json:/app/secrets/service-account.json:ro
    ports:
      - "8308:8000"
    restart: unless-stopped
    networks:
      - iot
      - frontend
    depends_on:
      nut:
        condition: service_healthy

secrets:
  github_token:
    file: ~/.github_token

networks:
  iot:
    external: true
  frontend:
    external: true
